<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cold Email Sender</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{
            margin-top:80px;
            border:none;
            border-radius:15px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.1);
        }

        .btn-send{
            width:100%;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4">
                        Cold Email Sender
                    </h2>

                    <form action="/send" method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                HR Email Address
                            </label>

                            <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    placeholder="Enter HR Email"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <select
                                    class="form-select"
                                    name="subject">

                                <option value="Application for DevOps Engineer / Intern Position - Manoj Gavhane">
                                    DevOps Engineer / Intern
                                </option>

                                <option value="Application for Cloud Engineer / Intern Position - Manoj Gavhane">
                                    Cloud Engineer / Intern
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Email Template
                            </label>

                            <select
                                    class="form-select"
                                    name="template">

                                <option value="devops">
                                    DevOps Template
                                </option>

                                <option value="cloud">
                                    Cloud Template
                                </option>

                            </select>

                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary btn-send">

                            Send Email

                        </button>

                    </form>

                    <hr>

                    <div class="alert alert-info">

                        <b>Resume:</b>
                        Automatically Attached

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
